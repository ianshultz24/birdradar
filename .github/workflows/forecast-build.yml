# Nightly arrival-forecast refresh — rebuilds the "Arriving Soon" seasonal
# curves for regions with recent traffic. Historic data is immutable, so this
# only re-derives the forward window as the calendar moves; runs once a day.
#
# Setup: reuses the APP_URL and CRON_SECRET repository secrets.
name: Forecast build

on:
  schedule:
    - cron: '17 8 * * *' # 08:17 UTC daily (off the hour to avoid runner contention)
  workflow_dispatch: {}

concurrency:
  group: forecast-build
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger forecast build
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and/or CRON_SECRET repository secrets are not set — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/forecast/build")
          echo "forecast build responded $code"
          if [ "$code" = "401" ]; then
            echo "::error::Unauthorized — GitHub CRON_SECRET must match the CRON_SECRET env var in Vercel"; exit 1
          fi
          # Don't fail the workflow on transient 5xx — next run retries
          if [ "$code" -ge 500 ] 2>/dev/null; then echo "::warning::forecast build got $code — will retry next run"; fi
