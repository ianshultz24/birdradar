# Push-alert watcher — pings the token-protected /api/alerts/run endpoint every
# 5 minutes so lifer alerts fire minutes after a report, with the app closed.
# Vercel Hobby cron only fires daily, so we schedule from GitHub Actions.
#
# Setup: add repository secrets APP_URL (e.g. https://birdradar.vercel.app) and
# CRON_SECRET (must match the CRON_SECRET env var set in Vercel).
name: Alert watcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# Don't stack runs if one is slow
concurrency:
  group: alert-watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger watcher
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and/or CRON_SECRET repository secrets are not set — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/alerts/run")
          echo "watcher responded $code"
          if [ "$code" = "401" ]; then
            echo "::error::Unauthorized — GitHub CRON_SECRET must match the CRON_SECRET env var in Vercel"; exit 1
          fi
          # Don't fail the workflow on transient 5xx — next tick retries
          if [ "$code" -ge 500 ] 2>/dev/null; then echo "::warning::watcher got $code — will retry next tick"; fi
